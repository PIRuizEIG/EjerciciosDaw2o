<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Simulador de compra</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Simulador de compra</h1>
        <p class="description">
            Esta aplicación permite simular el proceso de compra de una tienda online.
            Podrás registrar varios productos, aplicar descuentos según tu tipo de cliente
            y calcular los gastos de envío y el total final.
        </p>
    </header>
    <main>
        <div class="action-section">
            <button id="start" class="btn-primary">Iniciar compra</button>
        </div>

        <!-- El contenido generado por JS se insertará aquí -->
        <div id="result" class="result-section"></div>
    </main>
    <footer>
        <p>Desarrollo Web en Entorno Cliente · 2º DAW<br>Pablo Illescas Ruiz
        </p>
    </footer>
</body>

</html>
