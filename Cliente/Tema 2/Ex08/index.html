<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Entrenamiento</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <h1>Entrenamiento</h1>
    <hr>
    <h2>IVA</h2>
    <input id="precio" type="text" placeholder="Precio original">
    <button id="calcular">Calcular</button>
    <p id="descontado"></p>
    <hr>
    <h2>Par</h2>
    <input id="par" type="number" placeholder="Par o impar">
    <button id="esPar">Par o impar</button>
    <p id="impar"></p>
    <hr>
    <h2>Notas</h2>
    <input id="nota" placeholder="Nota">
    <button id="evaluar">Evaluar</button>
    <p id="cal"></p>
    <hr>
    <h2>Lista</h2>
    <ul id="numList"></ul>
</body>

</html>
